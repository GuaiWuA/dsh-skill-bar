name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: artifact gate + behaviour test (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The package ships no runtime dependency; react/react-dom exist only so the
      # offline behaviour test can render the components.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Artifact gate
        run: node build.mjs --check

      - name: Behaviour test
        run: node smoke-test.mjs

      # Proves the published tarball carries the client bundle and nothing the
      # runtime would need but the manifest forgot to list.
      - name: Package dry run
        run: npm pack --dry-run
